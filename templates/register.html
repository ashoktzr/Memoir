<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Your Diary</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="form-wrapper">
        <h2 style="margin-top: 0; text-align: center; font-weight: 500;">Begin Your Journey</h2>
        <form method="POST">
            <div class="form-group">
                <label>Choose a Username</label>
                <input type="text" name="username" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Choose a Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="diary-btn">Start Writing</button>
        </form>
        <div class="auth-switch-box">
            Already have a diary? <a href="{{ url_for('login') }}" class="auth-switch">Sign In here &rarr;</a>
        </div>
    </div>
</body>
</html>
