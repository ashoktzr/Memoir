<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="brand-logo">Memoir</a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">&larr; Return Home</a>
        </div>
    </nav>

    <div class="feed-container">
        <h1 style="margin-bottom: 2rem; font-weight: 500; text-align: center;">Shared Reflections</h1>
        {% if not posts %}
            <p style="color: var(--text-dim); text-align: center;">No public thoughts are currently shared on the network.</p>
        {% endif %}
        {% for post in posts %}
            <article class="post-card">
                <h2>
                    <a href="{{ url_for('show_post', post_id=post.id) }}">{{ post.title }}</a> 
                    <span style="font-size: 1.1rem; color: var(--text-dim); font-weight: 300;">
                        by 
                        <a href="{{ url_for('user_public_posts', username=post.author.username) }}" style="color: var(--magical-pink); text-decoration: underline;">@{{ post.author.username }}</a>
                    </span>
                </h2>
                <p style="color: var(--text-dim); line-height: 1.6; margin-top: 1rem;">{{ post.content | truncate(200) }}</p>
            </article>
        {% endfor %}
    </div>
</body>
</html>
