<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav class="navbar">
        <a href="{{ url_for('home') }}" class="brand-logo">Memoir</a>
        <div class="nav-links">
            <a href="{{ url_for('home') }}">&larr; Dashboard</a>
        </div>
    </nav>

    <div class="form-wrapper" style="max-width: 600px;">
        <h2 style="margin-top: 0; font-weight: 500; text-align: center;">New Diary Record</h2>
        <form method="POST">
            <div class="form-group">
                <label>Title</label>
                <input type="text" name="title" required autocomplete="off">
            </div>
            <div class="form-group">
                <label>Your Story</label>
                <textarea name="content" rows="8" required></textarea>
            </div>
            
            <div class="form-group">
                <label class="checkbox-label">
                    <input type="checkbox" name="is_public">
                    <span>Allow this memory to be listed on the public feed</span>
                </label>
            </div>
            
            <button type="submit" class="diary-btn">Save Entry</button>
        </form>
    </div>
</body>
</html>
