events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location / {
            # This is the magic line! Nginx forwards traffic to the "app" container on port 8000
            proxy_pass http://app:8000;
            
            # These headers pass the original user's IP and info through to Flask
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}